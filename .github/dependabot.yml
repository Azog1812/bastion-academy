version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule: { interval: weekly, day: monday }
    # Wait 7 days before proposing a freshly published version: most malicious
    # releases (account takeovers, typosquats) are detected and yanked within days.
    cooldown: { default-days: 7 }
    open-pull-requests-limit: 10
    groups:
      dev-tooling:
        dependency-type: development
        update-types: [minor, patch]
    labels: [dependencies]

  - package-ecosystem: docker
    directory: /
    schedule: { interval: weekly }
    cooldown: { default-days: 7 }
    labels: [dependencies, docker]

  # Keeps every SHA-pinned action current (pinning by SHA without updates
  # would trade supply-chain safety for missing security fixes).
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    cooldown: { default-days: 7 }
    groups:
      actions:
        patterns: ["*"]
    labels: [dependencies, ci]
