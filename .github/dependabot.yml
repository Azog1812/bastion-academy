version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule: { interval: weekly, day: monday }
    # Wait 7 days before proposing a freshly published version: most malicious
    # releases (account takeovers, typosquats) are detected and yanked within days.
    cooldown: { default-days: 7 }
    open-pull-requests-limit: 10
    ignore:
      # Types must match the oldest supported runtime (engines: node >= 22);
      # newer majors would type-check APIs that crash on Node 22.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # typescript-eslint supports TypeScript < 6.1 only; lift this when it
      # supports 7.x (npm ci fails on the peer-dependency conflict).
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
    groups:
      dev-tooling:
        dependency-type: development
        update-types: [minor, patch]
    labels: [dependencies]

  - package-ecosystem: docker
    directory: /
    schedule: { interval: weekly }
    cooldown: { default-days: 7 }
    ignore:
      # The build stage (node) and the runtime stage (distroless/nodejs24) must
      # share one Node major, and only even (LTS) majors are used. A major move
      # is one deliberate change to both FROM lines, not an automated bump.
      - dependency-name: "node"
        update-types: ["version-update:semver-major"]
    labels: [dependencies, docker]

  # Keeps every SHA-pinned action current (pinning by SHA without updates
  # would trade supply-chain safety for missing security fixes).
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    cooldown: { default-days: 7 }
    groups:
      actions:
        patterns: ["*"]
    labels: [dependencies, ci]
