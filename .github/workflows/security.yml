name: Security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 4 * * 1" # weekly: new CVEs appear even when the code doesn't change
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets:
    name: Secret scanning (gitleaks, full history)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # scan every commit, not just the tip: deleted secrets stay in history
          persist-credentials: false
      - name: gitleaks
        run: |
          docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.30.1 \
            git /repo --config /repo/.gitleaks.toml --redact --verbose --exit-code 1

  sast:
    name: SAST (Semgrep — OWASP Top 10 + project rules)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
    container:
      image: semgrep/semgrep:1.182.1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: semgrep
        run: |
          set +e
          semgrep scan \
            --config p/owasp-top-ten --config p/nodejs --config p/typescript --config p/jwt --config p/secrets \
            --config .semgrep/ \
            --metrics=off --error --sarif --output semgrep.sarif
          code=$?
          # Surface each finding as an inline annotation on the PR / commit.
          python3 - <<'PY' || true
          import json, os
          if os.path.exists("semgrep.sarif"):
              for run in json.load(open("semgrep.sarif"))["runs"]:
                  for r in run.get("results", []):
                      if r.get("suppressions"):  # reviewed `nosemgrep` exceptions
                          continue
                      loc = r["locations"][0]["physicalLocation"]
                      msg = r["message"]["text"].replace("\n", " ")[:300]
                      print(f"::error file={loc['artifactLocation']['uri']},line={loc['region']['startLine']}::[{r['ruleId']}] {msg}")
          PY
          echo "::notice::semgrep exit code $code"
          exit $code
      - uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        if: always()
        with:
          sarif_file: semgrep.sarif
          category: semgrep

  dependencies:
    name: SCA (npm audit + registry signatures)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: npm ci --ignore-scripts
      - name: Known vulnerabilities in production dependencies
        run: npm audit --omit=dev --audit-level=high
      - name: Verify registry signatures and provenance of every installed package
        run: npm audit signatures

  osv:
    name: SCA (OSV-Scanner)
    permissions:
      actions: read
      contents: read
      security-events: write
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@32d3cd482bdadfb38b186c0ad1b031902d55d932 # v2.7.1

  dependency-review:
    name: Dependency review (PR gate)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@bbc44d14a204704ccc493733616cd1e93a0321ec # v5.0.1
        with:
          fail-on-severity: moderate
          deny-licenses: GPL-3.0-only, AGPL-3.0-only
          comment-summary-in-pr: on-failure

  iac:
    name: IaC & Dockerfile (hadolint + Checkov)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387 # v3.5.0
        with:
          dockerfile: Dockerfile
          failure-threshold: warning
      # The lab image wraps intentionally vulnerable code: the container itself must still be clean.
      - uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387 # v3.5.0
        with:
          dockerfile: labs/Dockerfile
          failure-threshold: warning
      - uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387 # v3.5.0
        with:
          dockerfile: labs/command-injection/Dockerfile
          failure-threshold: warning
      - uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387 # v3.5.0
        with:
          dockerfile: labs/xss-stored/Dockerfile
          failure-threshold: warning
      - name: Checkov (Kubernetes manifests + Dockerfiles)
        run: |
          pipx run --spec checkov==3.4.0 checkov \
            --directory deploy/k8s --file Dockerfile --file labs/Dockerfile --file labs/command-injection/Dockerfile --file labs/xss-stored/Dockerfile \
            --config-file .checkov.yaml \
            --output cli --output sarif --output-file-path console,checkov.sarif
      - uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        if: always()
        with:
          sarif_file: checkov.sarif
          category: checkov
