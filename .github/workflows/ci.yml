name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Least privilege by default: every job declares exactly what it needs.
permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Lint, typecheck & test (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      # --ignore-scripts: no third-party install hook ever runs on the runner.
      - run: npm ci --ignore-scripts
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:coverage
      - run: npm run build

      - name: Coverage summary
        if: matrix.node == 24
        run: |
          # shellcheck disable=SC2016 # JS template literals, not shell expansions
          node -e '
            const s = require("./coverage/coverage-summary.json").total;
            const row = (k) => `| ${k} | ${s[k].pct}% |`;
            console.log(["### Coverage", "| Metric | % |", "|---|---|", ...["lines","statements","functions","branches"].map(row)].join("\n"));
          ' >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: matrix.node == 24
        with:
          name: coverage
          path: coverage/
          retention-days: 14

  alert-rules:
    name: Alert rules (promtool)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    env:
      # Same image and digest as the prometheus service in docker-compose.yml: keep them in sync.
      PROMETHEUS_IMAGE: prom/prometheus:v3.15.1@sha256:fa3302279710be2f21a8301ec17a8b4f2301fd829bd113839b3b6b02b6f191a2
      # Same for the alertmanager service (ADR 0018).
      ALERTMANAGER_IMAGE: prom/alertmanager:v0.34.2@sha256:39d8bb3966c694a124428a3a88fbcffd40bd069129ecd47c059f8a3f17c55f3b
    steps:
      - uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Syntax of the rules and of the scrape config, then the alert unit tests:
      # each alert must fire on the attack it is written for, and stay quiet otherwise.
      - name: promtool check and test
        run: |
          run() { docker run --rm --network none -v "$PWD/deploy/prometheus:/rules:ro" -w /rules --entrypoint promtool "$PROMETHEUS_IMAGE" "$@"; }
          run check rules alerts.yml
          run check config --syntax-only prometheus.yml
          run test rules alerts.test.yml

      # Who hears about each alert: amtool checks the routing of every alert of alerts.yml,
      # then a real Alertmanager (loopback, random port) proves the inhibition rules.
      - name: amtool routing and inhibition tests
        run: deploy/alertmanager/routes.test.sh
