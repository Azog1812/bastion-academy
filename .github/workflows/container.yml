name: Container

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  image:
    name: Build → test → scan → SBOM → (main) push, sign, attest
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write # push to GHCR (main only)
      id-token: write # Sigstore keyless signing via GitHub OIDC (no long-lived keys)
      attestations: write # SLSA build provenance
      security-events: write # Trivy SARIF → code scanning
    env:
      LOCAL_IMAGE: bastion:ci
    steps:
      - uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=sha,format=long
            type=ref,event=branch

      - name: Build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          tags: |
            ${{ env.LOCAL_IMAGE }}
            ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ---------- runtime hardening checks ----------
      - name: Image runs as non-root and ships no shell
        run: |
          user=$(docker image inspect "$LOCAL_IMAGE" --format '{{.Config.User}}')
          echo "image user: $user"
          test "$user" = "65532:65532"
          if docker run --rm --entrypoint /bin/sh "$LOCAL_IMAGE" -c true 2>/dev/null; then
            echo "::error::a shell exists in the runtime image"; exit 1
          fi
          echo "no shell in image ✔"

      - name: Smoke test with production-grade restrictions
        run: |
          docker run --rm "$LOCAL_IMAGE" dist/cli.js gen-secrets > .env.ci
          docker run -d --name bastion --env-file .env.ci \
            --read-only --tmpfs /tmp --cap-drop ALL --security-opt no-new-privileges \
            --pids-limit 128 --memory 768m -v bastion-data:/data -p 127.0.0.1:3000:3000 "$LOCAL_IMAGE"
          for _ in $(seq 1 30); do curl -fsS http://127.0.0.1:3000/readyz && break; sleep 1; done
          ./scripts/smoke-test.sh http://127.0.0.1:3000

      - name: Container logs
        if: always()
        run: docker logs bastion 2>&1 | tail -n 50 || true

      # ---------- vulnerability scanning ----------
      - name: Trivy (report all, SARIF)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.LOCAL_IMAGE }}
          format: sarif
          output: trivy.sarif
          scanners: vuln,secret,misconfig
          exit-code: "0"

      - uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        if: always()
        with:
          sarif_file: trivy.sarif
          category: trivy-image

      - name: Trivy (gate — fail on fixable HIGH/CRITICAL)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.LOCAL_IMAGE }}
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          skip-setup-trivy: true

      - name: SBOM (CycloneDX)
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: ${{ env.LOCAL_IMAGE }}
          format: cyclonedx-json
          output-file: sbom.cdx.json
          artifact-name: sbom.cdx.json

      # ---------- supply chain: publish, sign, attest (main only) ----------
      - name: Log in to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push the exact image that was tested and scanned
        id: push
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          for t in $TAGS; do docker push "$t"; done
          first=$(echo "$TAGS" | head -n1)
          ref=$(docker image inspect "$first" --format '{{index .RepoDigests 0}}')
          echo "name=${ref%@*}" >> "$GITHUB_OUTPUT"
          echo "digest=${ref#*@}" >> "$GITHUB_OUTPUT"
          # shellcheck disable=SC2016 # literal backticks for Markdown
          printf '### Published\n`%s`\n' "$ref" >> "$GITHUB_STEP_SUMMARY"

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        if: steps.push.outcome == 'success'

      - name: Sign (Sigstore keyless) and attach the SBOM as a signed attestation
        if: steps.push.outcome == 'success'
        env:
          REF: ${{ steps.push.outputs.name }}@${{ steps.push.outputs.digest }}
        run: |
          cosign sign --yes "$REF"
          cosign attest --yes --type cyclonedx --predicate sbom.cdx.json "$REF"

      - name: SLSA build provenance
        if: steps.push.outcome == 'success'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ steps.push.outputs.name }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

      - name: Verify what we just published (as a consumer would)
        if: steps.push.outcome == 'success'
        env:
          REF: ${{ steps.push.outputs.name }}@${{ steps.push.outputs.digest }}
          IDENTITY: https://github.com/${{ github.repository }}/.github/workflows/container.yml@refs/heads/main
        run: |
          cosign verify "$REF" \
            --certificate-identity "$IDENTITY" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com > /dev/null
          cosign verify-attestation "$REF" --type cyclonedx \
            --certificate-identity "$IDENTITY" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com > /dev/null
          echo "signature and SBOM attestation verified ✔"
