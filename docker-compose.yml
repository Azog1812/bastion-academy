# Local run with the same hardening as production:
#   npm ci && npm run build && node dist/cli.js gen-secrets > .env
#   docker compose --profile labs build     # the lab images (v5), once
#   docker compose up --build
#
# Labs (ADR 0009):
#
#   browser ──► bastion (127.0.0.1:3000)  ──lab-control (internal)──►  lab-runner ── Docker socket
#   browser ──► lab-gateway (127.0.0.1:8088) ──per-instance network (internal)──► lab container
#
# Only the runner touches Docker. Each lab instance gets its own network with no
# route out; the gateway is the only thing attached to it besides the lab.
#
# Observability (ADR 0011, 0018), optional: docker compose --profile observability up -d
#   Prometheus (127.0.0.1:9090) ──metrics (internal)──► bastion:9464, bearer token
#   Prometheus ──metrics──► Alertmanager (no published port: routing, grouping, silences)
#   browser ──► Grafana (127.0.0.1:3001, login required) ──metrics──► Prometheus, Alertmanager
services:
  bastion:
    build: .
    image: bastion:local
    env_file: .env
    environment:
      NODE_ENV: production
      LAB_RUNNER_URL: http://lab-runner:4000
      # Metrics on their own port, reachable only on the internal `metrics` network
      # (not published). The token is in .env; checked here so an old .env fails clearly.
      METRICS_PORT: "9464"
      METRICS_HOST: 0.0.0.0
      METRICS_TOKEN: "${METRICS_TOKEN:?METRICS_TOKEN is missing from .env, run gen-secrets}"
      # A copy of the audit log for Wazuh (ADR 0015), on its own volume: the database stays private.
      AUDIT_EXPORT_FILE: /var/log/bastion/audit.json
    ports:
      - "127.0.0.1:3000:3000" # loopback only: not exposed to the LAN
    networks: [default, lab-control, metrics]
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    volumes:
      - bastion-data:/data
      - bastion-audit:/var/log/bastion
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    # scrypt N=2^17 uses 128 MiB per hash; libuv runs at most UV_THREADPOOL_SIZE (4)
    # hashes at once, so ~512 MiB peak for hashing + the app itself.
    mem_limit: 768m
    cpus: 1.0
    restart: unless-stopped

  # Holds the Docker socket: root-equivalent on the host. Reachable only from the
  # platform (internal network, token), accepts only catalog lab ids, publishes nothing.
  lab-runner:
    image: bastion:local
    command: ["--disable-warning=ExperimentalWarning", "dist/labs/runner/main.js"]
    environment:
      PORT: "4000" # the image defaults to the platform's 3000
      # Only its own secret, not the platform's whole .env.
      LAB_RUNNER_TOKEN: "${LAB_RUNNER_TOKEN:?LAB_RUNNER_TOKEN is missing from .env, run gen-secrets}"
      LAB_GATEWAY_CONTAINER: bastion-lab-gateway
      # LAB_RUNTIME: runsc   # gVisor, if installed on the host: a much stronger lab sandbox
    # The socket is root:root 0660 on Docker Desktop and most engines. Root here adds
    # nothing to what the socket already grants, and the container stays read-only and cap-less.
    user: "0:0"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    networks: [lab-control]
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    pids_limit: 64
    mem_limit: 128m
    cpus: 0.5
    healthcheck:
      test: ["CMD", "/nodejs/bin/node", "-e", "fetch('http://127.0.0.1:4000/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 3s
    restart: unless-stopped

  # The only published entry to the labs. No secret, no Docker access.
  lab-gateway:
    image: bastion:local
    container_name: bastion-lab-gateway # fixed: the runner attaches it to each instance network
    command: ["--disable-warning=ExperimentalWarning", "dist/labs/gateway/main.js"]
    environment:
      PORT: "8088"
    ports:
      - "127.0.0.1:8088:8088"
    networks: [lab-edge]
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    pids_limit: 64
    mem_limit: 128m
    cpus: 0.5
    healthcheck:
      test: ["CMD", "/nodejs/bin/node", "-e", "fetch('http://127.0.0.1:8088/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 3s
    restart: unless-stopped

  # Lab images, built only: `docker compose --profile labs build`. The runner starts
  # them, one per learner, with the hardening of src/labs/runner/spec.ts.
  lab-sqli-login:
    build: { context: labs, args: { LAB: sqli-login } }
    image: bastion-lab-sqli-login:local
    profiles: [labs]
  lab-idor-invoices:
    build: { context: labs, args: { LAB: idor-invoices } }
    image: bastion-lab-idor-invoices:local
    profiles: [labs]
  lab-mass-assignment:
    build: { context: labs, args: { LAB: mass-assignment } }
    image: bastion-lab-mass-assignment:local
    profiles: [labs]
  lab-ssrf-preview:
    build: { context: labs, args: { LAB: ssrf-preview } }
    image: bastion-lab-ssrf-preview:local
    profiles: [labs]
  lab-path-traversal:
    build: { context: labs, args: { LAB: path-traversal } }
    image: bastion-lab-path-traversal:local
    profiles: [labs]
  lab-chained-intranet:
    build: { context: labs, args: { LAB: chained-intranet } }
    image: bastion-lab-chained-intranet:local
    profiles: [labs]
  lab-race-coupon:
    build: { context: labs, args: { LAB: race-coupon } }
    image: bastion-lab-race-coupon:local
    profiles: [labs]
  lab-jwt-none:
    build: { context: labs, args: { LAB: jwt-none } }
    image: bastion-lab-jwt-none:local
    profiles: [labs]
  # Its own Dockerfile: this lab needs a shell (see the comment in it).
  lab-command-injection:
    build: { context: labs, dockerfile: command-injection/Dockerfile }
    image: bastion-lab-command-injection:local
    profiles: [labs]
  # Ships a headless Chromium (the victim): a large image, built once.
  lab-xss-stored:
    build: { context: labs, dockerfile: xss-stored/Dockerfile }
    image: bastion-lab-xss-stored:local
    profiles: [labs]

  # Scrapes the platform and evaluates deploy/prometheus/alerts.yml (Alerts tab).
  prometheus:
    image: prom/prometheus:v3.15.1@sha256:fa3302279710be2f21a8301ec17a8b4f2301fd829bd113839b3b6b02b6f191a2
    profiles: [observability]
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=7d
    volumes:
      - ./deploy/prometheus:/etc/prometheus:ro
      - prometheus-data:/prometheus
    # A file, not an environment variable: Prometheus reads credentials_file.
    secrets: [metrics_token]
    ports:
      - "127.0.0.1:9090:9090"
    networks: [metrics, observability-edge]
    # Not read_only: Compose copies an environment-sourced secret into the container,
    # which a read-only root refuses. Little is lost: the image runs as nobody, its
    # files belong to root, and it has no capability; only /prometheus is writable.
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    mem_limit: 512m
    cpus: 0.5
    restart: unless-stopped

  # Routes Prometheus' alerts (ADR 0018). It has no authentication of its own, and its API
  # creates silences: an attacker who silences alerts has blinded the defenders. So it
  # publishes no port at all; people reach it through Grafana, after logging in.
  alertmanager:
    image: prom/alertmanager:v0.34.2@sha256:39d8bb3966c694a124428a3a88fbcffd40bd069129ecd47c059f8a3f17c55f3b
    profiles: [observability]
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
      # A single instance: no gossip port listening for peers.
      - --cluster.listen-address=
    volumes:
      - ./deploy/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager-data:/alertmanager # silences and notification log survive a restart
    networks: [metrics]
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    pids_limit: 64
    mem_limit: 128m
    cpus: 0.25
    restart: unless-stopped

  # Dashboards and the alert view (ADR 0018), provisioned from deploy/grafana (read-only).
  grafana:
    image: grafana/grafana:13.3.0@sha256:488984b716c0862639f91a698adbe2862677a5a07bad42da5f03f3030883b205
    profiles: [observability]
    environment:
      GF_SECURITY_ADMIN_USER: admin
      # From a file (compose secret), never a plain variable: `docker inspect` shows variables.
      GF_SECURITY_ADMIN_PASSWORD__FILE: /run/secrets/grafana_admin_password
      GF_SECURITY_COOKIE_SECURE: "false" # plain http on loopback; true behind TLS
      GF_SECURITY_COOKIE_SAMESITE: strict
      GF_SECURITY_DISABLE_GRAVATAR: "true"
      GF_SECURITY_CONTENT_SECURITY_POLICY: "true"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_AUTH_DISABLE_LOGIN_FORM: "false"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_USERS_ALLOW_ORG_CREATE: "false"
      GF_SNAPSHOTS_EXTERNAL_ENABLED: "false"
      GF_PLUGINS_PLUGIN_ADMIN_ENABLED: "false"
      GF_PLUGINS_PREINSTALL_DISABLED: "true"
      # No phoning home: no telemetry, update checks or news feed.
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "false"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /etc/grafana/dashboards/bastion-overview.json
    volumes:
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/grafana/dashboards:/etc/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    secrets: [grafana_admin_password]
    ports:
      - "127.0.0.1:3001:3000" # loopback only (3000 is Bastion)
    networks: [metrics, observability-edge]
    # Not read_only, for the same reason as Prometheus (an environment-sourced secret is
    # copied into the container). Runs as uid 472 without capabilities.
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    mem_limit: 512m
    cpus: 0.5
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # Wazuh (ADR 0013), optional, about 4 GiB of RAM while running.
  #   docker compose --profile wazuh up -d     # once: certificates, users, then the stack
  # Afterwards, learners start and stop it from the web UI (Wazuh module) through the
  # lab runner, which may start and stop these three containers and nothing else.
  # Dashboard: https://localhost:8443, user admin, password WAZUH_ADMIN_PASSWORD (.env).

  # Setup, step 1: TLS certificates, generated offline (no network at all).
  wazuh-certs:
    image: wazuh/wazuh-certs-generator:0.0.4@sha256:369b4d58509aab074b188596870c81584f7120e653d9ef83c591f0f785dcf325
    profiles: [wazuh]
    entrypoint: ["bash", "/setup/certs.sh"]
    user: "0:0" # chown of each component's directory
    network_mode: none
    volumes:
      - ./deploy/wazuh/certs.sh:/setup/certs.sh:ro
      - wazuh-certs:/out

  # Setup, step 2: indexer users, without the demo accounts and their public passwords.
  wazuh-users:
    image: wazuh/wazuh-indexer:4.14.9@sha256:615465315b560d974100ea55bbe67efa72afc6490ef563d4d1bef127df0e98f6
    profiles: [wazuh]
    entrypoint: ["bash", "/setup/users.sh"]
    user: "0:0"
    network_mode: none
    environment:
      WAZUH_ADMIN_PASSWORD: ${WAZUH_ADMIN_PASSWORD:-}
      WAZUH_DASHBOARD_PASSWORD: ${WAZUH_DASHBOARD_PASSWORD:-}
    volumes:
      - ./deploy/wazuh/users.sh:/setup/users.sh:ro
      - wazuh-certs:/out

  wazuh-indexer:
    image: wazuh/wazuh-indexer:4.14.9@sha256:615465315b560d974100ea55bbe67efa72afc6490ef563d4d1bef127df0e98f6
    container_name: bastion-wazuh-indexer # fixed: the lab runner starts/stops it by name
    profiles: [wazuh]
    restart: "no" # stays stopped until a learner starts it
    depends_on:
      wazuh-certs: { condition: service_completed_successfully }
      wazuh-users: { condition: service_completed_successfully }
    environment:
      OPENSEARCH_JAVA_OPTS: -Xms1g -Xmx1g
    ulimits:
      memlock: { soft: -1, hard: -1 }
      nofile: { soft: 65536, hard: 65536 }
    volumes:
      - wazuh-indexer-data:/var/lib/wazuh-indexer
      - ./deploy/wazuh/wazuh.indexer.yml:/usr/share/wazuh-indexer/config/opensearch.yml:ro
      - type: volume
        source: wazuh-certs
        target: /usr/share/wazuh-indexer/config/certs
        read_only: true
        volume: { subpath: indexer }
      - type: volume
        source: wazuh-certs
        target: /usr/share/wazuh-indexer/config/opensearch-security/internal_users.yml
        read_only: true
        volume: { subpath: security/internal_users.yml }
    networks:
      wazuh: { aliases: [wazuh.indexer] }
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    mem_limit: 2g
    healthcheck:
      test: ["CMD", "curl", "-sk", "-o", "/dev/null", "https://localhost:9200"]
      interval: 15s
      timeout: 5s
      retries: 20

  wazuh-manager:
    image: wazuh/wazuh-manager:4.14.9@sha256:dbb337727a6b6b17e24b1ccfe4c6e95fd983286ba0ccbf29d568144aa9527c6b
    container_name: bastion-wazuh-manager
    hostname: wazuh.manager
    profiles: [wazuh]
    restart: "no"
    depends_on:
      wazuh-certs: { condition: service_completed_successfully }
    environment:
      INDEXER_URL: https://wazuh.indexer:9200
      INDEXER_USERNAME: admin
      INDEXER_PASSWORD: ${WAZUH_ADMIN_PASSWORD:-}
      FILEBEAT_SSL_VERIFICATION_MODE: full
      SSL_CERTIFICATE_AUTHORITIES: /etc/ssl/wazuh/root-ca.pem
      SSL_CERTIFICATE: /etc/ssl/wazuh/wazuh.manager.pem
      SSL_KEY: /etc/ssl/wazuh/wazuh.manager.key
      API_USERNAME: wazuh-wui
      API_PASSWORD: ${WAZUH_API_PASSWORD:-}
    ulimits:
      memlock: { soft: -1, hard: -1 }
      nofile: { soft: 655360, hard: 655360 }
    volumes:
      - wazuh-api-configuration:/var/ossec/api/configuration
      - wazuh-etc:/var/ossec/etc
      - wazuh-logs:/var/ossec/logs
      - wazuh-queue:/var/ossec/queue
      - wazuh-var-multigroups:/var/ossec/var/multigroups
      - wazuh-integrations:/var/ossec/integrations
      - wazuh-active-response:/var/ossec/active-response/bin
      - wazuh-agentless:/var/ossec/agentless
      - wazuh-wodles:/var/ossec/wodles
      - wazuh-filebeat-etc:/etc/filebeat
      - wazuh-filebeat-var:/var/lib/filebeat
      - ./deploy/wazuh/wazuh_manager.conf:/wazuh-config-mount/etc/ossec.conf:ro
      # Copied into etc/rules at start by the image's init script (ADR 0015).
      - ./deploy/wazuh/bastion_rules.xml:/wazuh-config-mount/etc/rules/bastion_rules.xml:ro
      # Bastion's audit log, read-only: Wazuh reads it, never writes it.
      - bastion-audit:/var/log/bastion:ro
      - type: volume
        source: wazuh-certs
        target: /etc/ssl/wazuh
        read_only: true
        volume: { subpath: manager }
    networks:
      wazuh: { aliases: [wazuh.manager] }
    # Runs as root under s6 and drops to the wazuh user itself: capabilities kept, no new privileges.
    security_opt:
      - no-new-privileges:true
    mem_limit: 1g
    healthcheck:
      test: ["CMD", "curl", "-sk", "-o", "/dev/null", "https://localhost:55000"]
      interval: 15s
      timeout: 5s
      retries: 20

  wazuh-dashboard:
    image: wazuh/wazuh-dashboard:4.14.9@sha256:e8e2340265feb6f61711d2ba460d04d2dea875ee46de26cd1832da2a3558a341
    container_name: bastion-wazuh-dashboard
    hostname: wazuh.dashboard
    profiles: [wazuh]
    restart: "no"
    depends_on:
      wazuh-certs: { condition: service_completed_successfully }
    environment:
      WAZUH_API_URL: https://wazuh.manager
      DASHBOARD_USERNAME: kibanaserver
      DASHBOARD_PASSWORD: ${WAZUH_DASHBOARD_PASSWORD:-}
      API_USERNAME: wazuh-wui
      API_PASSWORD: ${WAZUH_API_PASSWORD:-}
    volumes:
      - ./deploy/wazuh/opensearch_dashboards.yml:/usr/share/wazuh-dashboard/config/opensearch_dashboards.yml:ro
      - wazuh-dashboard-config:/usr/share/wazuh-dashboard/data/wazuh/config
      - type: volume
        source: wazuh-certs
        target: /usr/share/wazuh-dashboard/certs
        read_only: true
        volume: { subpath: dashboard }
    ports:
      - "127.0.0.1:8443:5601" # loopback only
    networks:
      wazuh: { aliases: [wazuh.dashboard] }
      wazuh-edge: {}
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    mem_limit: 1g
    healthcheck:
      test: ["CMD", "curl", "-sk", "-o", "/dev/null", "-f", "https://localhost:5601/app/login"]
      interval: 15s
      timeout: 5s
      retries: 30

secrets:
  metrics_token:
    environment: METRICS_TOKEN
  grafana_admin_password:
    environment: GRAFANA_ADMIN_PASSWORD

networks:
  # Platform ↔ runner only. No route out, nothing else joins it.
  lab-control:
    internal: true
  # Lets the gateway publish 127.0.0.1:8088. Lab instances never join it.
  lab-edge: {}
  # Prometheus → platform metrics port. No route out.
  metrics:
    internal: true
  # Lets Prometheus publish its UI on 127.0.0.1:9090.
  observability-edge: {}
  # Wazuh components among themselves. No route out (no feed downloads, no telemetry).
  wazuh:
    internal: true
  # Lets the Wazuh dashboard publish 127.0.0.1:8443.
  wazuh-edge: {}

volumes:
  bastion-data:
  bastion-audit:
  prometheus-data:
  alertmanager-data:
  grafana-data:
  wazuh-certs:
  wazuh-indexer-data:
  wazuh-api-configuration:
  wazuh-etc:
  wazuh-logs:
  wazuh-queue:
  wazuh-var-multigroups:
  wazuh-integrations:
  wazuh-active-response:
  wazuh-agentless:
  wazuh-wodles:
  wazuh-filebeat-etc:
  wazuh-filebeat-var:
  wazuh-dashboard-config:
