# Load balancer in front of several API replicas (docker-compose.replicas.yml, ADR 0023).
# The API trusts exactly one proxy hop (TRUST_PROXY=1), so this proxy must *replace* the
# client's X-Forwarded-For with the address it sees: appending would let a client choose
# the IP the rate limits count (send "X-Forwarded-For: <random>" and never be limited).
upstream bastion_api {
    # Resolved at start: one address per replica (Docker's DNS round robin).
    server bastion:3000;
    keepalive 16;
}

server {
    listen 8080;
    server_tokens off;
    client_max_body_size 128k;   # the API refuses more than 100 kB anyway

    location / {
        proxy_pass http://bastion_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        # Reviewed: the Host the browser sent, port included, is what the session routes compare
        # Origin with (CSRF defence, src/http/session.ts); nothing routes or links on it, and a
        # forged Host only fails that check. The variable without the port would refuse them.
        proxy_set_header Host $http_host; # nosemgrep: generic.nginx.security.request-host-used.request-host-used
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 35s;
        # A replica that fails is skipped for the next requests.
        proxy_next_upstream error timeout http_502 http_503;
    }
}
