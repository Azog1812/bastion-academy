# Zero-trust networking: deny everything, then allow the single flow needed.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-all
  namespace: bastion
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: bastion-allow-ingress-controller
  namespace: bastion
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: bastion
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
      ports:
        - protocol: TCP
          port: 3000
# No egress rule at all: the API needs no outbound traffic (not even DNS).
# A compromised pod cannot exfiltrate data or reach a C2 server.
