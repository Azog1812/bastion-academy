apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: bastion
resources:
  - namespace.yaml
  - serviceaccount.yaml
  - pvc.yaml
  - deployment.yaml
  - service.yaml
  - networkpolicy.yaml
configMapGenerator:
  - name: bastion-config
    literals:
      - ACTIVE_KEY_ID=k1
labels:
  - pairs:
      app.kubernetes.io/name: bastion
      app.kubernetes.io/part-of: bastion
    includeSelectors: false
# Secrets are NOT in git. Create them out-of-band (see secret.example.yaml),
# ideally via External Secrets Operator / Sealed Secrets / Vault.
