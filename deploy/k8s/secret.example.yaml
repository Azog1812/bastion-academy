# NOT applied by kustomize. Example only — real values come from a secret manager.
#   kubectl -n bastion create secret generic bastion-secrets --from-env-file=.env.production
apiVersion: v1
kind: Secret
metadata:
  name: bastion-secrets
  namespace: bastion
type: Opaque
stringData:
  JWT_SECRET: "<base64 32 bytes>"
  AUDIT_HMAC_KEY: "<base64 32 bytes>"
  FLAG_HMAC_KEY: "<base64 32 bytes>"
  ENCRYPTION_KEYS: "k1:<base64 32 bytes>"
  # Shared with Prometheus (its scrape config reads it from a file, credentials_file).
  METRICS_TOKEN: "<base64 32 bytes>"
