openapi: 3.1.0
info:
  title: Bastion API
  version: 6.0.0
  summary: Hardened, envelope-encrypted notes API.
  description: |
    Every note is encrypted at rest with its own AES-256-GCM data key, wrapped by a
    rotating key-encryption key. Access tokens are short-lived JWTs; refresh tokens
    are opaque, single-use and rotated with reuse detection.

    All error responses share one shape: `{ error, message, requestId }`.
  license:
    name: MIT
    identifier: MIT
servers:
  - url: http://localhost:3000
security:
  - bearer: []

tags:
  - name: auth
  - name: me
  - name: notes
  - name: learning
    description: Curriculum and progress (Bastion Academy)
  - name: session
    description: Browser sessions, refresh token in an HttpOnly cookie (ADR 0007)
  - name: mfa
    description: TOTP second factor (RFC 6238) and recovery codes (ADR 0008)
  - name: challenges
    description: Per-learner HMAC flags and the opt-in scoreboard (ADR 0008)
  - name: admin
  - name: probes

paths:
  /healthz:
    get:
      tags: [probes]
      summary: Liveness probe
      security: []
      responses:
        "200": { description: Alive, content: { application/json: { schema: { type: object, properties: { status: { const: ok } } } } } }
  /readyz:
    get:
      tags: [probes]
      summary: Readiness probe (database reachable)
      security: []
      responses:
        "200": { description: Ready }
        "503": { description: Not ready }

  /v1/auth/register:
    post:
      tags: [auth]
      summary: Create an account
      security: []
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/Credentials" } } } }
      responses:
        "201": { description: Created, content: { application/json: { schema: { $ref: "#/components/schemas/User" } } } }
        "400": { $ref: "#/components/responses/ValidationError" }
        "409": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /v1/auth/login:
    post:
      tags: [auth]
      summary: Exchange credentials for a token pair
      description: Unknown e-mail, wrong password and locked account all return the same 401. If the account has MFA enabled, the response is an MFA challenge to complete with /v1/auth/mfa.
      security: []
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/Credentials" } } } }
      responses:
        "200": { description: Authenticated or second factor required, content: { application/json: { schema: { oneOf: [{ $ref: "#/components/schemas/TokenPair" }, { $ref: "#/components/schemas/MfaChallenge" }] } } } }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /v1/auth/mfa:
    post:
      tags: [auth, mfa]
      summary: Complete a login with a TOTP code or a recovery code
      description: The challenge is single-use, expires after 5 minutes and dies after 5 wrong codes. Wrong codes count towards the account lockout. A TOTP code is never accepted twice.
      security: []
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/MfaLogin" } } } }
      responses:
        "200": { description: Authenticated, content: { application/json: { schema: { $ref: "#/components/schemas/TokenPair" } } } }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /v1/auth/refresh:
    post:
      tags: [auth]
      summary: Rotate a refresh token
      description: Single use. Replaying a used token revokes the whole session family.
      security: []
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/RefreshRequest" } } } }
      responses:
        "200": { description: New token pair, content: { application/json: { schema: { $ref: "#/components/schemas/TokenPair" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /v1/auth/logout:
    post:
      tags: [auth]
      summary: Revoke a refresh token family (idempotent)
      security: []
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/RefreshRequest" } } } }
      responses:
        "204": { description: Logged out }

  /v1/session/login:
    post:
      tags: [session]
      summary: Browser login
      description: Same checks as /v1/auth/login. The refresh token is set in an HttpOnly, Secure, SameSite=Strict `__Host-` cookie and never returned in the body. Foreign Origin headers are refused.
      security: []
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/Credentials" } } } }
      responses:
        "200": { description: Logged in (cookie set) or second factor required (no cookie yet), content: { application/json: { schema: { oneOf: [{ $ref: "#/components/schemas/AccessToken" }, { $ref: "#/components/schemas/MfaChallenge" }] } } } }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { description: Cross-origin request refused, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "429": { $ref: "#/components/responses/RateLimited" }
  /v1/session/mfa:
    post:
      tags: [session, mfa]
      summary: Browser variant of /v1/auth/mfa; sets the refresh cookie on success
      security: []
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/MfaLogin" } } } }
      responses:
        "200": { description: Logged in, content: { application/json: { schema: { $ref: "#/components/schemas/AccessToken" } } } }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { description: Cross-origin request refused, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "429": { $ref: "#/components/responses/RateLimited" }
  /v1/session/refresh:
    post:
      tags: [session]
      summary: Rotate the refresh cookie and get a new access token
      description: Single-use rotation with reuse detection. A failed refresh clears the cookie.
      security: []
      responses:
        "200": { description: Rotated, content: { application/json: { schema: { $ref: "#/components/schemas/AccessToken" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { description: Cross-origin request refused, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "429": { $ref: "#/components/responses/RateLimited" }
  /v1/session/logout:
    post:
      tags: [session]
      summary: Revoke the browser session and clear the cookie (idempotent)
      security: []
      responses:
        "204": { description: Logged out }
        "403": { description: Cross-origin request refused, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
  /v1/me:
    get:
      tags: [me]
      summary: Current principal
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: string, format: uuid }
                  role: { enum: [user, admin] }
                  displayName: { type: [string, "null"] }
                  mfaEnabled: { type: boolean }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /v1/me/profile:
    put:
      tags: [me, challenges]
      summary: Set or remove my public scoreboard pseudonym
      description: Opt-in. null removes the user from the scoreboard. Unique, case-insensitive.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [displayName]
              properties:
                displayName: { type: [string, "null"], minLength: 3, maxLength: 24, pattern: "^[\\p{L}\\p{N} _-]+$" }
      responses:
        "200": { description: Saved, content: { application/json: { schema: { type: object, properties: { displayName: { type: [string, "null"] } } } } } }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "409": { $ref: "#/components/responses/Error" }
  /v1/me/mfa/setup:
    post:
      tags: [mfa]
      summary: Start TOTP enrolment (re-authentication required)
      description: Returns the seed once. MFA is not active until /v1/me/mfa/enable confirms a code.
      requestBody: { required: true, content: { application/json: { schema: { type: object, additionalProperties: false, required: [password], properties: { password: { type: string } } } } } }
      responses:
        "200": { description: Seed for the authenticator app, content: { application/json: { schema: { type: object, properties: { secret: { type: string, description: Base32 }, otpauthUri: { type: string } } } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "409": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /v1/me/mfa/enable:
    post:
      tags: [mfa]
      summary: Confirm enrolment with a first code; returns 10 single-use recovery codes (shown once)
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/MfaCode" } } } }
      responses:
        "200": { description: Enabled, content: { application/json: { schema: { type: object, properties: { recoveryCodes: { type: array, items: { type: string } } } } } } }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "409": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /v1/me/mfa/disable:
    post:
      tags: [mfa]
      summary: Turn MFA off; needs both the password and a valid code
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: false, required: [password, code], properties: { password: { type: string }, code: { type: string, minLength: 6, maxLength: 19 } } }
      responses:
        "204": { description: Disabled }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /v1/me/password:
    post:
      tags: [me]
      summary: Change password (revokes every session)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [currentPassword, newPassword]
              properties:
                currentPassword: { type: string }
                newPassword: { type: string, minLength: 12, maxLength: 128 }
      responses:
        "204": { description: Changed }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /v1/me/logout-all:
    post:
      tags: [me]
      summary: Revoke every session, including live access tokens
      responses:
        "204": { description: Done }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /v1/notes:
    get:
      tags: [notes]
      summary: List my notes (titles only)
      parameters:
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
        - { name: offset, in: query, schema: { type: integer, minimum: 0, default: 0 } }
      responses:
        "200":
          description: Page of notes
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/NoteSummary" } }
                  total: { type: integer }
                  limit: { type: integer }
                  offset: { type: integer }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      tags: [notes]
      summary: Create a note
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/NoteInput" } } } }
      responses:
        "201": { description: Created, content: { application/json: { schema: { $ref: "#/components/schemas/Note" } } } }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /v1/notes/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      tags: [notes]
      summary: Read one of my notes
      description: A note owned by someone else returns the same 404 as a missing one.
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Note" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/Error" }
    put:
      tags: [notes]
      summary: Replace a note (optimistic concurrency)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: "#/components/schemas/NoteInput"
                - type: object
                  required: [version]
                  properties: { version: { type: integer, minimum: 1 } }
      responses:
        "200": { description: Updated, content: { application/json: { schema: { $ref: "#/components/schemas/Note" } } } }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
    delete:
      tags: [notes]
      summary: Delete a note
      responses:
        "204": { description: Deleted }
        "404": { $ref: "#/components/responses/Error" }

  /v1/curriculum:
    get:
      tags: [learning]
      summary: Learning catalogue with my progress
      description: Levels, paths, modules and lessons, with per-module lock state computed server-side. Quiz answers are never included.
      responses:
        "200": { description: Catalogue, content: { application/json: { schema: { $ref: "#/components/schemas/Curriculum" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /v1/lessons/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { $ref: "#/components/schemas/Slug" } }
    get:
      tags: [learning]
      summary: Read a lesson (Markdown) and its quiz questions
      responses:
        "200": { description: Lesson, content: { application/json: { schema: { $ref: "#/components/schemas/Lesson" } } } }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { description: Prerequisite modules not completed, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "404": { $ref: "#/components/responses/Error" }
  /v1/lessons/{id}/complete:
    parameters:
      - { name: id, in: path, required: true, schema: { $ref: "#/components/schemas/Slug" } }
    post:
      tags: [learning]
      summary: Mark a lesson as completed, grading its quiz server-side
      description: Idempotent. Every quiz question must be answered exactly once. Rate-limited per account.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                answers:
                  type: array
                  maxItems: 20
                  items:
                    type: object
                    additionalProperties: false
                    required: [question, choices]
                    properties:
                      question: { $ref: "#/components/schemas/Slug" }
                      choices: { type: array, maxItems: 6, items: { type: integer, minimum: 0, maximum: 5 } }
      responses:
        "200":
          description: Graded
          content:
            application/json:
              schema:
                oneOf:
                  - type: object
                    properties: { passed: { const: true }, completedAt: { type: string, format: date-time }, alreadyCompleted: { type: boolean } }
                  - type: object
                    properties: { passed: { const: false }, incorrect: { type: array, items: { type: string } } }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { description: Prerequisite modules not completed, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "404": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /v1/challenges:
    get:
      tags: [challenges]
      summary: Challenges with my lock and solve state (no artifacts, no briefs)
      responses:
        "200": { description: Challenges, content: { application/json: { schema: { type: object, properties: { items: { type: array, items: { $ref: "#/components/schemas/ChallengeSummary" } } } } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /v1/challenges/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { $ref: "#/components/schemas/Slug" } }
    get:
      tags: [challenges]
      summary: A challenge's brief and my personal artifact
      responses:
        "200": { description: Challenge, content: { application/json: { schema: { $ref: "#/components/schemas/Challenge" } } } }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { description: Module not unlocked yet, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "404": { $ref: "#/components/responses/Error" }
  /v1/challenges/{id}/submit:
    parameters:
      - { name: id, in: path, required: true, schema: { $ref: "#/components/schemas/Slug" } }
    post:
      tags: [challenges]
      summary: Submit a flag
      description: Flags are per learner. A wrong flag and another learner's flag get the same answer; the latter is recorded in the audit log. Idempotent once solved. Rate-limited per account.
      requestBody: { required: true, content: { application/json: { schema: { type: object, additionalProperties: false, required: [flag], properties: { flag: { type: string, maxLength: 100 } } } } } }
      responses:
        "200":
          description: Checked
          content:
            application/json:
              schema:
                oneOf:
                  - type: object
                    properties: { correct: { const: true }, points: { type: integer }, alreadySolved: { type: boolean } }
                  - type: object
                    properties: { correct: { const: false } }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { description: Module not unlocked yet, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "404": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /v1/challenges/{id}/lab:
    parameters:
      - { name: id, in: path, required: true, schema: { $ref: "#/components/schemas/Slug" } }
    post:
      tags: [challenges]
      summary: Start my lab for this challenge
      description: |
        Starts an isolated instance of the challenge's intentionally vulnerable service, holding
        this learner's flag (ADR 0009). One running lab per learner; idempotent for the same
        challenge; rate-limited per account. The URL is a per-instance origin on the local
        lab gateway.
      requestBody: { required: false, content: { application/json: { schema: { type: object, additionalProperties: false } } } }
      responses:
        "201": { description: Running, content: { application/json: { schema: { $ref: "#/components/schemas/LabInstance" } } } }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { description: Module not unlocked yet, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "404": { description: Unknown challenge, or not a lab challenge, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "409": { description: Another lab is running for this account, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { description: Labs disabled, image not built, or runner unavailable, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
    delete:
      tags: [challenges]
      summary: Stop my lab for this challenge
      responses:
        "204": { description: Stopped }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { description: No running lab of mine for this challenge, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
  /v1/challenges/{id}/detect:
    parameters:
      - { name: id, in: path, required: true, schema: { $ref: "#/components/schemas/Slug" } }
    post:
      tags: [challenges]
      summary: Evaluate my detection rule (blue-team challenges)
      description: |
        Scores a rule against the learner's own labelled dataset (ADR 0010). Solved at 100 % recall
        and 100 % precision. Rule keys must be dataset fields, optionally with |contains, |startswith,
        |endswith, |gte or |lte; no regular expressions. Rate-limited per account.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [rule]
              properties:
                rule:
                  type: object
                  properties:
                    match: { description: "A block {field|modifier: value | [values]} or a list of blocks (OR)" }
                    exclude: { description: Same shape as match }
                    threshold:
                      type: object
                      additionalProperties: false
                      properties:
                        groupBy: { type: string }
                        distinct: { type: string }
                        min: { type: integer, minimum: 2, maximum: 1000 }
                        windowSeconds: { type: integer, minimum: 1, maximum: 86400 }
      responses:
        "200":
          description: Scored
          content:
            application/json:
              schema:
                type: object
                properties:
                  alerts: { type: integer }
                  detected: { type: integer }
                  missed: { type: integer }
                  falsePositives: { type: integer }
                  total: { type: integer }
                  examples: { type: object, properties: { missed: { type: array, items: { type: string } }, falsePositives: { type: array, items: { type: string } } } }
                  solved: { type: boolean }
                  points: { type: integer }
                  alreadySolved: { type: boolean }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { description: Module not unlocked yet, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "404": { description: Unknown challenge, or not a detection challenge, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "429": { $ref: "#/components/responses/RateLimited" }
  /v1/scoreboard:
    get:
      tags: [challenges]
      summary: Opt-in scoreboard (pseudonym and score only) and my own score
      responses:
        "200":
          description: Scoreboard
          content:
            application/json:
              schema:
                type: object
                properties:
                  entries: { type: array, maxItems: 50, items: { type: object, properties: { rank: { type: integer }, displayName: { type: string }, score: { type: integer } } } }
                  me: { type: object, properties: { score: { type: integer }, rank: { type: [integer, "null"] }, displayName: { type: [string, "null"] } } }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /v1/admin/audit:
    get:
      tags: [admin]
      summary: Read the audit trail (admin)
      parameters:
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 500, default: 100 } }
        - { name: before, in: query, schema: { type: integer, minimum: 1 } }
      responses:
        "200": { description: Audit entries, newest first }
        "403": { $ref: "#/components/responses/Error" }
  /v1/admin/audit/verify:
    get:
      tags: [admin]
      summary: Verify the HMAC chain of the audit trail (admin)
      responses:
        "200":
          description: Verification result
          content:
            application/json:
              schema:
                type: object
                properties:
                  valid: { type: boolean }
                  checked: { type: integer }
                  firstInvalidSeq: { type: [integer, "null"] }
        "403": { $ref: "#/components/responses/Error" }

components:
  securitySchemes:
    bearer: { type: http, scheme: bearer, bearerFormat: JWT }
  schemas:
    Credentials:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email: { type: string, format: email, maxLength: 254 }
        password: { type: string, minLength: 12, maxLength: 128 }
    User:
      type: object
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email }
    TokenPair:
      type: object
      properties:
        accessToken: { type: string }
        refreshToken: { type: string }
        tokenType: { const: Bearer }
        expiresIn: { type: integer, description: Seconds }
    AccessToken:
      type: object
      properties:
        accessToken: { type: string }
        tokenType: { const: Bearer }
        expiresIn: { type: integer, description: Seconds }
    RefreshRequest:
      type: object
      additionalProperties: false
      required: [refreshToken]
      properties:
        refreshToken: { type: string }
    NoteInput:
      type: object
      additionalProperties: false
      required: [title, body]
      properties:
        title: { type: string, minLength: 1, maxLength: 200 }
        body: { type: string, maxLength: 65536 }
    NoteSummary:
      type: object
      properties:
        id: { type: string, format: uuid }
        title: { type: string }
        version: { type: integer }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    Note:
      allOf:
        - $ref: "#/components/schemas/NoteSummary"
        - type: object
          properties: { body: { type: string } }
    Slug: { type: string, pattern: "^[a-z0-9][a-z0-9-]*$", maxLength: 64 }
    Curriculum:
      type: object
      properties:
        levels: { type: array, items: { type: object, properties: { level: { type: integer }, title: { type: string }, goal: { type: string } } } }
        progress: { type: object, properties: { completed: { type: integer }, total: { type: integer } } }
        paths:
          type: array
          items:
            type: object
            properties:
              id: { type: string }
              title: { type: string }
              summary: { type: string }
              level: { type: integer }
              modules:
                type: array
                items:
                  type: object
                  properties:
                    id: { type: string }
                    title: { type: string }
                    summary: { type: string }
                    prerequisites: { type: array, items: { type: string } }
                    unlocked: { type: boolean }
                    completed: { type: boolean }
                    lessons:
                      type: array
                      items:
                        type: object
                        properties:
                          id: { type: string }
                          title: { type: string }
                          minutes: { type: integer }
                          hasQuiz: { type: boolean }
                          completed: { type: boolean }
    Lesson:
      type: object
      properties:
        id: { type: string }
        pathId: { type: string }
        moduleId: { type: string }
        title: { type: string }
        minutes: { type: integer }
        body: { type: string, description: Markdown. Clients must render it without trusting it as HTML. }
        references: { type: array, items: { type: object, properties: { label: { type: string }, url: { type: string, format: uri } } } }
        quiz:
          type: array
          items:
            type: object
            properties:
              id: { type: string }
              prompt: { type: string }
              choices: { type: array, items: { type: string } }
              multiple: { type: boolean }
        completed: { type: boolean }
        completedAt: { type: [string, "null"], format: date-time }
    MfaChallenge:
      type: object
      properties:
        mfaRequired: { const: true }
        mfaToken: { type: string, description: Opaque, single-use }
        expiresIn: { type: integer, description: Seconds }
    MfaCode:
      type: object
      additionalProperties: false
      required: [code]
      properties:
        code: { type: string, minLength: 6, maxLength: 19, description: 6-digit TOTP code }
    MfaLogin:
      type: object
      additionalProperties: false
      required: [mfaToken, code]
      properties:
        mfaToken: { type: string, minLength: 20, maxLength: 100 }
        code: { type: string, minLength: 6, maxLength: 19, description: 6-digit TOTP code or XXXX-XXXX-XXXX-XXXX recovery code }
    ChallengeSummary:
      type: object
      properties:
        id: { type: string }
        title: { type: string }
        moduleId: { type: string }
        points: { type: integer }
        unlocked: { type: boolean }
        solved: { type: boolean }
        solvedAt: { type: [string, "null"], format: date-time }
    Challenge:
      allOf:
        - $ref: "#/components/schemas/ChallengeSummary"
        - type: object
          properties:
            brief: { type: string, description: Markdown }
            artifact: { type: object, additionalProperties: { type: string }, description: Per-learner data hiding the flag. Display as text only. Empty for lab challenges. }
            detection:
              description: Present for detection challenges (null otherwise); the dataset is in artifact.events
              oneOf: [{ type: "null" }, { $ref: "#/components/schemas/DetectionInfo" }]
            lab:
              description: Present for lab challenges (null otherwise)
              oneOf:
                - type: "null"
                - type: object
                  properties:
                    id: { type: string, description: Catalog lab id }
                    enabled: { type: boolean, description: Whether this installation runs labs }
                    ttlSeconds: { type: integer }
                    instance: { oneOf: [{ type: "null" }, { $ref: "#/components/schemas/LabInstance" }] }
    DetectionInfo:
      type: object
      properties:
        fields: { type: array, items: { type: string } }
        unit: { enum: [event, entity] }
        entityField: { type: ["string", "null"] }
        events: { type: integer }
    LabInstance:
      type: object
      properties:
        url: { type: string, format: uri, example: "http://l0123456789abcdef0123456789abcdef.lab.localhost:8088/" }
        expiresAt: { type: string, format: date-time }
    Error:
      type: object
      required: [error, message, requestId]
      properties:
        error: { type: string }
        message: { type: string }
        requestId: { type: string, format: uuid }
        issues: { type: array, items: { type: object, properties: { path: { type: string }, message: { type: string } } } }
  responses:
    Error: { description: Error, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
    ValidationError: { description: Invalid request, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
    Unauthorized: { description: Missing, invalid, expired or revoked credentials, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
    RateLimited: { description: Too many requests (see RateLimit headers), content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
